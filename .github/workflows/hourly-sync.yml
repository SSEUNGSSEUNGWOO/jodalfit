name: Hourly Bid Sync

# 매시 05분 (UTC/KST 동일 분). 2026-10-15 까지 다른 PC 의 작업 스케줄러(jodalfit-hourly-sync)가 돌리던 사이클을
# 그대로 옮긴 것 — 켜둔 컴퓨터 없이 돌게. 기존 lunch-sync(12:30 KST) 는 이 워크플로가 대체.
# GH Actions 스케줄은 혼잡 시 5~30분 늦을 수 있다. 각 스텝은 멱등(upsert)이라 겹쳐도 안전.
#
# 2026-10-16 첨부 수집·추출·요약은 documents-sync.yml(2시간 주기)로 분리. 한 회차가 28~42분이라 다음 정각 예약이
# 유실됐다(10-15 하루 24번 중 6번만 실행). 여기 남은 건 등록·공고 수집·상세 필드·임베딩 — 약 10분. 새 공고가
# 추천에 잡히는 지연은 그대로 1시간.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # summarize_bid_documents (Haiku Message Batches)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}  # ingest_bid_notices_full --fill 이 psycopg 직결로 UPDATE
      # 임베딩 공간 전환은 리포 Variables 하나(EMBED_SPACE=openai|kure, 0045/0046 적용 후).
      # kure 면 모델이 로컬 CPU 에서 돈다 → KURE_BACKEND=torch(sentence-transformers fp32, 정확).
      EMBED_SPACE: ${{ vars.EMBED_SPACE || 'openai' }}
      KURE_BACKEND: torch
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: KURE 모델 캐시 (kure 공간일 때만 의미 있음 — torch 백엔드가 HF 허브에서 1.1GB 를 받는다)
        if: vars.EMBED_SPACE == 'kure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kure-v1

      - name: Install dependencies
        if: vars.EMBED_SPACE != 'kure'
        run: uv sync

      - name: Install dependencies (kure — sentence-transformers/torch)
        if: vars.EMBED_SPACE == 'kure'
        run: uv sync --extra embed-cpu

      - name: 검색된 회사 등록 (최근 30일 검색, 100곳)
        run: uv run python -m jobs.register_searched_companies --days 30 --limit 100
        continue-on-error: true

      - name: 입찰공고 수집 (최근 24h)
        run: uv run python -m jobs.ingest_bid_notices --days-back 1
        continue-on-error: true

      # 상세 API 에만 오는 필드(0047/0051: 물품분류번호·사전규격 번호·자격등록 마감·공동수급·발주계획 번호)를
      # 표준 API 로 들어온 행에 채운다. 2026-10-16 까지 물품만 긁어 0049(자격등록 마감 제외)와 사전규격·발주계획
      # 연결이 물품에만 작동했다 — 네 구분 전부로. 2일 창: 정정 차수가 늦게 붙는 경우를 덮는다. 2차 패스가 UPDATE 라 멱등.
      - name: 공고 상세 필드 — 물품·용역·공사·외자 (분류번호·사전규격·자격등록 마감·발주계획 번호, 최근 2일)
        run: uv run python -m jobs.ingest_bid_notices_full --since "$(date -u -d '2 days ago' +%F)" --fill
        continue-on-error: true

      # 한도 500 은 '그 시간에 새로 들어온 공고'만 처리하기 위한 것이다. 5000 이던 때는 백로그가
      # 생기면 러너 CPU 가 그걸 떠안아 한 번에 24분을 썼다(2026-10-15 실측: KURE CPU 분당 50건).
      # 백필은 CI 가 아니라 GPU PC 에서 한다 — 같은 작업이 거기선 분당 500건 이상이다.
      - name: 입찰공고 임베딩 (신규)
        run: uv run python -m jobs.embed_bid_notices --limit 500 --batch 50
        continue-on-error: true

      # IndexNow(Bing·네이버): 최근 2시간에 바뀐 공고·회사 페이지 URL 을 알린다. 키 파일은 frontend/public/<key>.txt.
      # 구글은 안 받는다. 실패해도 다음 시간에 다시 보내면 되므로 continue-on-error.
      - name: IndexNow 핑 (최근 2h 갱신 공고·회사)
        run: uv run python -m jobs.ping_indexnow --hours 2
        continue-on-error: true
