name: Hourly Bid Sync

# 매시 05분 (UTC/KST 동일 분). 2026-10-15 까지 다른 PC 의 작업 스케줄러(jodalfit-hourly-sync)가 돌리던 사이클을
# 그대로 옮긴 것 — 켜둔 컴퓨터 없이 돌게. 기존 lunch-sync(12:30 KST) 는 이 워크플로가 대체.
# GH Actions 스케줄은 혼잡 시 5~30분 늦을 수 있다. 각 스텝은 멱등(upsert)이라 겹쳐도 안전.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # summarize_bid_documents (Haiku Message Batches)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 임베딩 공간 전환은 리포 Variables 하나(EMBED_SPACE=openai|kure, 0045/0046 적용 후).
      # kure 면 모델이 로컬 CPU 에서 돈다 → KURE_BACKEND=torch(sentence-transformers fp32, 정확).
      EMBED_SPACE: ${{ vars.EMBED_SPACE || 'openai' }}
      KURE_BACKEND: torch
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: KURE 모델 캐시 (kure 공간일 때만 의미 있음 — torch 백엔드가 HF 허브에서 1.1GB 를 받는다)
        if: vars.EMBED_SPACE == 'kure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kure-v1

      - name: Install dependencies
        if: vars.EMBED_SPACE != 'kure'
        run: uv sync

      - name: Install dependencies (kure — sentence-transformers/torch)
        if: vars.EMBED_SPACE == 'kure'
        run: uv sync --extra embed-cpu

      - name: 검색된 회사 등록 (최근 30일 검색, 100곳)
        run: uv run python -m jobs.register_searched_companies --days 30 --limit 100
        continue-on-error: true

      - name: 입찰공고 수집 (최근 24h)
        run: uv run python -m jobs.ingest_bid_notices --days-back 1
        continue-on-error: true

      - name: 첨부 목록 수집 (최근 24h)
        run: uv run python -m jobs.ingest_bid_attachments --days-back 1
        continue-on-error: true

      - name: 첨부 추출 (300건)
        run: uv run python -m jobs.extract_bid_documents --limit 300
        continue-on-error: true

      - name: 공고 조건 요약 — 수거 + 제출 (100건)
        run: uv run python -m jobs.summarize_bid_documents --limit 100
        continue-on-error: true

      # 한도 500 은 '그 시간에 새로 들어온 공고'만 처리하기 위한 것이다. 5000 이던 때는 백로그가
      # 생기면 러너 CPU 가 그걸 떠안아 한 번에 24분을 썼다(2026-10-15 실측: KURE CPU 분당 50건).
      # 백필은 CI 가 아니라 GPU PC 에서 한다 — 같은 작업이 거기선 분당 500건 이상이다.
      - name: 입찰공고 임베딩 (신규)
        run: uv run python -m jobs.embed_bid_notices --limit 500 --batch 50
        continue-on-error: true
