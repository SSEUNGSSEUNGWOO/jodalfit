name: Daily Data Sync

# 매일 새벽 5시 KST (= 20:00 UTC 전일) 데이터 갱신
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: # 수동 실행도 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}  # purge_expired_documents 는 psycopg 직결
      # 임베딩 공간 전환은 리포 Variables 하나(EMBED_SPACE=openai|kure, 0045/0046 적용 후).
      # kure 면 모델이 로컬 CPU 에서 돈다 → KURE_BACKEND=torch(sentence-transformers fp32, 정확).
      EMBED_SPACE: ${{ vars.EMBED_SPACE || 'openai' }}
      KURE_BACKEND: torch
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: KURE 모델 캐시 (kure 공간일 때만 의미 있음 — torch 백엔드가 HF 허브에서 1.1GB 를 받는다)
        if: vars.EMBED_SPACE == 'kure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kure-v1

      - name: Install dependencies
        if: vars.EMBED_SPACE != 'kure'
        run: uv sync

      - name: Install dependencies (kure — sentence-transformers/torch)
        if: vars.EMBED_SPACE == 'kure'
        run: uv sync --extra embed-cpu

      - name: 입찰공고 수집 (어제 신규)
        run: uv run python -m jobs.ingest_bid_notices --days-back 1
        continue-on-error: true

      - name: 계약 수집
        run: uv run python -m jobs.ingest_contracts --days-back 1
        continue-on-error: true

      - name: 낙찰자 수집 (회사 투찰율 신호)
        run: uv run python -m jobs.ingest_scsbid_winners --days-back 1
        continue-on-error: true

      - name: 참가업체 수집 (회사 참가 시그널)
        # 낙찰자 수집 직후 실행 — 같은 공고의 rank 2+ 참가업체를 공고별 호출로 채움
        run: uv run python -m jobs.ingest_bid_participants --days-back 2 --limit 2000
        continue-on-error: true

      - name: 사전규격 수집 (물품·용역·공사·외자)
        run: uv run python -m jobs.ingest_pre_specs --days-back 1
        continue-on-error: true

      - name: 사전규격 의견 수집
        run: uv run python -m jobs.ingest_pre_spec_opinions --days-back 1
        continue-on-error: true

      # 공고 라이프사이클 첫 칸(0051 order_plan_unty_no 로 연결). API 가 구분당 한 해 400건 안팎이라 가볍다.
      # 발주계획은 미래 일정이라 months-back 은 '등록 월' 기준 — 과거 2개월 + 앞 6개월(잡 내부)을 매일 다시 받는다(멱등).
      - name: 발주계획 수집 (물품·용역·공사·외자)
        run: uv run python -m jobs.ingest_order_plans --months-back 2
        continue-on-error: true

      - name: 면허제한 수집 (자격 필터용)
        run: uv run python -m jobs.ingest_license_limit --days-back 1
        continue-on-error: true

      - name: 참가지역 수집 (자격 필터용)
        run: uv run python -m jobs.ingest_rgn_limit --days-back 1
        continue-on-error: true

      - name: 입찰공고 임베딩 (신규)
        run: uv run python -m jobs.embed_bid_notices --limit 500 --batch 50  # 매시간 잡이 주 담당. 5000 이면 러너 CPU 로 24분+ → sync 잡 50분 제한에 잘려 company-vectors 까지 skip(2026-10-15 22:46)
        continue-on-error: true

      - name: 사전규격 임베딩 (신규)
        run: uv run python -m jobs.embed_pre_specs --limit 1000 --batch 50
        continue-on-error: true

      - name: sitemap warm-up (Google이 신선한 sitemap 보도록 강제 히트)
        # generateSitemaps로 쪼갠 뒤 /sitemap.xml은 404다. 세그먼트를 각각 쳐야 한다.
        # 세그먼트 수는 frontend/src/lib/sitemap-segments.ts의 TOTAL_SEGMENTS와 맞출 것.
        # 하나라도 200이 아니면 실패로 처리 — 조용히 no-op이 되면 2026-07 동결이 재발한다.
        run: |
          fail=0
          for i in $(seq 0 8); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://jodalfit.co.kr/sitemap/$i.xml")
            echo "sitemap/$i.xml -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: 마감 지난 공고 문서 텍스트 비우기 (저장 증가 차단)
        run: uv run python -m jobs.purge_expired_documents
        continue-on-error: true

      # continue-on-error 없음 — 위 스텝들이 전부 초록인 이유가 continue-on-error 다. 조용히 0건·1초 만에 끝난
      # 잡(2026-10 두 번)은 여기서 빨간색이 된다. 규칙은 jobs/check_ingest_health.py 머리에.
      - name: 수집 잡 건강 점검 (실패·성공인데 0건·너무 빨리 끝남·48시간 누락)
        run: uv run python -m jobs.check_ingest_health

  enrich-companies:
    # 매일 회사 마스터 풍부화 — 1,500개/일 (UsrInfoService02 엔드포인트별 일 10k 한도 내)
    # 주의: 기존 주 1회 조건(schedule == '0 20 * * 0')은 등록 cron이 '0 20 * * *'뿐이라
    # 스케줄로는 한 번도 매칭되지 않던 버그였음 → 조건 제거로 매일 실행.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # backfill_companies_basic·check_business_status 는 psycopg 직결 — 이 변수가 없어 매일 1초 만에 exit 1
      # 하던 것이 continue-on-error 에 가려져 있었다(2026-10-14 발견). 세션 풀러(:5432) URL.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: 회사 기본정보 갱신 (변경분 2일 — 매일 실행이라 짧게, stub 채우기 누락 방지)
        run: uv run python -m jobs.ingest_companies_userinfo --days-back 2
        continue-on-error: true

      - name: 회사 기본정보 백필 (사업자번호 단위 3,000개/일 — 낙찰·계약 stub 회사의 지역·주소 채우기)
        # 변경일 기반 갱신은 stub 회사를 영영 못 채운다. 5.7만 건이라 약 19일에 걸쳐 분산.
        run: uv run python -m jobs.backfill_companies_basic --limit 3000
        continue-on-error: true

      - name: 사업자등록 상태 재확인 (국세청, 3,000개/일 → 30일 주기 전량. 폐업은 noindex·사이트맵 제외)
        run: uv run python -m jobs.check_business_status --limit 3000
        continue-on-error: true

      - name: 회사 업종/공급물품 풍부화 (1500개, 검색·최근수주 회사 우선)
        # 회사당 2개 API 호출 × ~1초 → 1500개에 ~50분. 더 늘리면 timeout 위험.
        run: uv run python -m jobs.ingest_company_details --limit 1500
        continue-on-error: true


  company-vectors:
    # 회사 벡터 재계산은 enrich-companies 에서 분리 — 풍부화가 API 지연으로 90분을 넘기면 이 단계가
    # 잘려 벡터가 하루 밀리던 문제(2026-10-10, 10-14). 수집(sync)이 끝난 뒤 풍부화와 나란히 돈다.
    # 풍부화 중인 회사는 다음 날 벡터에 반영된다.
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}  # jobs/_common import 가드용
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 임베딩 공간 전환은 리포 Variables 하나(EMBED_SPACE=openai|kure, 0045/0046 적용 후).
      # kure 면 모델이 로컬 CPU 에서 돈다 → KURE_BACKEND=torch(sentence-transformers fp32, 정확).
      EMBED_SPACE: ${{ vars.EMBED_SPACE || 'openai' }}
      KURE_BACKEND: torch
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: KURE 모델 캐시 (kure 공간일 때만 의미 있음 — torch 백엔드가 HF 허브에서 1.1GB 를 받는다)
        if: vars.EMBED_SPACE == 'kure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kure-v1

      - name: Install dependencies
        if: vars.EMBED_SPACE != 'kure'
        run: uv sync

      - name: Install dependencies (kure — sentence-transformers/torch)
        if: vars.EMBED_SPACE == 'kure'
        run: uv sync --extra embed-cpu

      - name: 회사 벡터 재계산
        # kure 공간의 런타임은 업종 텍스트 캐시 적중률이 결정한다(0046 text_embeddings).
        # 2.5만 회사 중 업종 텍스트가 바뀌는 건 하루 수백 건 — 나머지는 캐시 히트라 모델 호출이
        # 거의 없다. 캐시가 빈 첫 실행만 CPU 로 2.5만 건(시간당 ~1만) → 60분 timeout 을 넘긴다.
        # 그래서 첫 적재는 백필(Task 4, 노트북 GPU)이 하고, 이 스텝은 그 뒤 증분만 맡는다.
        run: uv run python -m jobs.compute_company_vectors --limit 25000 --chunk-size 100
