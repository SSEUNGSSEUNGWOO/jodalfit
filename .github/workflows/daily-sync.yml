name: Daily Data Sync

# 매일 새벽 5시 KST (= 20:00 UTC 전일) 데이터 갱신
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: # 수동 실행도 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: 입찰공고 수집 (어제 신규)
        run: uv run python -m jobs.ingest_bid_notices --days-back 1
        continue-on-error: true

      - name: 계약 수집
        run: uv run python -m jobs.ingest_contracts --days-back 1
        continue-on-error: true

      - name: 낙찰자 수집 (회사 투찰율 신호)
        run: uv run python -m jobs.ingest_scsbid_winners --days-back 1
        continue-on-error: true

      - name: 사전규격 수집 (SW)
        run: uv run python -m jobs.ingest_pre_specs --days-back 1
        continue-on-error: true

      - name: 사전규격 의견 수집
        run: uv run python -m jobs.ingest_pre_spec_opinions --days-back 1
        continue-on-error: true

      - name: 면허제한 수집 (자격 필터용)
        run: uv run python -m jobs.ingest_license_limit --days-back 1
        continue-on-error: true

      - name: 참가지역 수집 (자격 필터용)
        run: uv run python -m jobs.ingest_rgn_limit --days-back 1
        continue-on-error: true

      - name: 입찰공고 임베딩 (신규)
        run: uv run python -m jobs.embed_bid_notices --limit 5000 --batch 50
        continue-on-error: true

      - name: 사전규격 임베딩 (신규)
        run: uv run python -m jobs.embed_pre_specs --limit 1000 --batch 50
        continue-on-error: true

  enrich-companies:
    # 주 1회 (월요일) 회사 마스터 풍부화 (UsrInfoService02 한도 분산)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.schedule == '0 20 * * 0' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: 회사 기본정보 갱신 (변경분 14일 — stub 채우기 누락 방지)
        run: uv run python -m jobs.ingest_companies_userinfo --days-back 14
        continue-on-error: true

      - name: 회사 업종/공급물품 풍부화 (1500개)
        # 회사당 2개 API 호출 × ~1초 → 1500개에 ~50분. 더 늘리면 timeout 위험.
        run: uv run python -m jobs.ingest_company_details --limit 1500
        continue-on-error: true

      - name: 회사 벡터 재계산
        run: uv run python -m jobs.compute_company_vectors --limit 25000 --chunk-size 100
        continue-on-error: true
