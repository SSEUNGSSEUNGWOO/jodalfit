name: Weekly Mail

# 매주 월요일 08:00 KST (= 23:00 UTC 일요일) — 저장한 회사의 새 공고 주간 메일 (jobs/send_weekly_mail.py)
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "보내지 않고 대상만 출력"
        type: boolean
        default: false

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}          # auth.users 읽기 + 발송 기록
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}      # 없으면 dry-run 처럼 동작(보내지 않음)
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}  # 그만 받기 링크의 HMAC — Vercel 의 값과 같아야 한다
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBED_SPACE: ${{ vars.EMBED_SPACE || 'openai' }}
      KURE_BACKEND: torch
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: KURE 모델 캐시
        if: vars.EMBED_SPACE == 'kure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kure-v1

      - name: Install dependencies
        if: vars.EMBED_SPACE != 'kure'
        run: uv sync

      - name: Install dependencies (kure)
        if: vars.EMBED_SPACE == 'kure'
        run: uv sync --extra embed-cpu

      - name: 주간 메일 발송
        run: uv run python -m jobs.send_weekly_mail ${{ inputs.dry_run && '--dry-run' || '' }}
