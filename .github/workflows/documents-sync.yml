name: Documents Sync

# 첨부 수집 → 추출 → 요약, 2시간마다 (매 짝수 시 35분 UTC — hourly-sync 의 05분과 겹치지 않게).
# 2026-10-16 hourly-sync 에서 분리: 첨부 추출 150건이 16분, 요약이 1~2분이라 매시간 잡이 28~42분까지 늘어
# 다음 정각 예약이 유실됐다. 여기선 잘려도 매시간 공고 수집·임베딩에는 영향이 없다.
# 150건/2시간 = 1,800 공고/일 ≥ 정상 유입 ~1천 공고/일. 백로그가 생기면 --limit 을 올리지 말고 회차를 늘린다.
on:
  schedule:
    - cron: "35 */2 * * *"
  workflow_dispatch:

concurrency:
  group: documents-sync
  cancel-in-progress: false

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      NARAJANGTEO_API_KEY: ${{ secrets.NARAJANGTEO_API_KEY }}  # ingest_bid_attachments + jobs/_common import 가드
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # summarize_bid_documents (Haiku Message Batches)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.11"

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: 첨부 목록 수집 (최근 24h)
        run: uv run python -m jobs.ingest_bid_attachments --days-back 1
        continue-on-error: true

      # 150: 공고당 첨부 3.5개·파일당 ~2초라 한도까지 차도 ~17분 (2026-10-15 실측).
      - name: 첨부 추출 (150건)
        run: uv run python -m jobs.extract_bid_documents --limit 150
        continue-on-error: true

      - name: 공고 조건 요약 — 수거 + 제출 (100건)
        run: uv run python -m jobs.summarize_bid_documents --limit 100
        continue-on-error: true
