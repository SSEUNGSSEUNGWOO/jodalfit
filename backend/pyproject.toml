[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.136.1",
    "google-auth>=2.58.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "olefile>=0.47",
    "onnxruntime>=1.31.0",
    "openai>=2.38.0",
    "openpyxl>=3.1.5",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.72.0",
    "slowapi>=0.1.9",
    "supabase>=2.30.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.47.0",
]

# 정확한 임베딩이 필요한 쪽만(매일 배치·GPU 백필) — Railway 는 기본 deps 만 깔아서 가볍게 둔다.
# 설치: uv sync --extra embed-cpu  (local_embed.py 의 KURE_BACKEND=torch)
[project.optional-dependencies]
embed-cpu = [
    "sentence-transformers>=3",
    "torch",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
