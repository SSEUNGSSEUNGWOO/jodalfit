<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>조달핏 — 주황 고르기</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;background:#faf9f6;color:#141414;font-family:Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 80px}
h1{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.sub{font-size:13px;color:#6b6b67;margin:0 0 28px}
.row{display:grid;grid-template-columns:150px 1fr 1fr;gap:24px;align-items:center;padding:22px 0;border-top:1px solid #e6e4df}
.row:last-child{border-bottom:1px solid #e6e4df}
.name{font-size:13px}.name b{display:block;font-size:14px;margin-bottom:4px}.name code{font-size:12px;color:#6b6b67}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.box{position:relative}
.box label{display:block;font-size:11px;color:#737370;margin-bottom:6px;letter-spacing:.04em}
.in{display:flex;align-items:center;height:56px;border:2px solid var(--o);border-radius:6px;background:#fff;padding:0 6px 0 18px;font-size:18px}
.in span{flex:1;color:#8f8f8b}
.in .bt{height:40px;padding:0 18px;border-radius:4px;background:var(--o);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center}
.in.fill{background:var(--o);border-color:var(--o);color:#fff}.in.fill span{color:rgba(255,255,255,.82)}.in.fill .bt{background:#fff;color:var(--o)}
.in.line{border:0;border-bottom:2px solid var(--o);border-radius:0;background:transparent;padding-left:0}.in.line .bt{background:transparent;color:var(--o);padding-right:0;font-size:15px}
.meta{font-size:11.5px;color:#6b6b67;margin-top:8px}
.meta b{color:#141414;font-weight:600}
.logo{font-size:14px;font-weight:700;margin-top:10px}.logo i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o);vertical-align:1px;margin-right:6px}
.note{font-size:12.5px;color:#55554f;line-height:1.7;margin-top:28px;max-width:72ch}
</style></head><body><div class="wrap">
<h1>주황 고르기</h1>
<p class="sub">같은 검색창에 색만 바꿨습니다. 왼쪽은 테두리·버튼만, 오른쪽은 칸 전체를 채운 것. 아래 작은 글씨는 흰 글자 대비(4.5:1 넘어야 흰 글자를 쓸 수 있습니다).</p>
<div id="rows"></div>
<p class="note">흰 글자 대비가 4.5:1 에 못 미치는 주황은 "칸 전체를 채우고 흰 글씨" 로는 못 씁니다(채운 칸 안 글자가 안 읽힘). 그 경우 테두리·버튼·밑줄처럼 먹 글씨 옆에 두는 방식으로만 씁니다. 로고 점·마감 D-day·마지막 12개 선·검토 버튼이 그 자리입니다.</p>
</div>
<script>
const C=[["인주 (지금)","#e8431b"],["주황 A — 선명","#ff6a00"],["주황 B — 표준","#f97316"],["주황 C — 따뜻","#ff7a2f"],["주황 D — 귤","#ff8c1a"],["주황 E — 진한","#e85d04"]];
function lum(h){const [r,g,b]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b}
function cr(a,b){const [x,y]=[lum(a),lum(b)].sort((p,q)=>q-p);return ((x+.05)/(y+.05)).toFixed(2)}
document.getElementById('rows').innerHTML=C.map(([n,h])=>`<div class="row" style="--o:${h}">
<div class="name"><b><span class="chip" style="background:${h}"></span>${n}</b><code>${h}</code><div class="logo"><i></i>조달핏</div></div>
<div class="box"><label>테두리 + 버튼</label><div class="in"><span>회사명 · 사업자번호 · 하는 일</span><div class="bt">찾기</div></div>
<div class="in line" style="margin-top:12px"><span>회사명 · 사업자번호 · 하는 일</span><div class="bt">찾기 →</div></div>
<div class="meta">흰 글자 대비 <b>${cr(h,'#ffffff')}</b> : 1 · 먹 글자 대비 <b>${cr(h,'#141414')}</b> : 1</div></div>
<div class="box"><label>칸 전체 채움</label><div class="in fill"><span>회사명 · 사업자번호 · 하는 일</span><div class="bt">찾기</div></div>
<div class="meta">${cr(h,'#ffffff')>=4.5?'흰 글자 가능':'흰 글자 대비 미달 — 채움형은 권하지 않음'}</div></div>
</div>`).join('');
</script></body></html>
